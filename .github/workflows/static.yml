# Darende Tarım — static GitHub Pages deployment
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f urunler.html
          test -f robots.txt
          test -f sitemap.xml
          test -f assets/css/style.css
          test -f assets/js/config.js
          test -f assets/js/products.js
          test -f assets/js/main.js
          test -f assets/images/hero/hero-premium-desktop.webp
          test -f assets/images/hero/hero-premium-mobile.webp
          test -f capa-makineleri/index.html
          test -f jeneratorler/index.html
          test -f hakkimizda/index.html
          test -f iletisim/index.html
          test -f scripts/validate-site.mjs
          node --check assets/js/config.js
          node --check assets/js/products.js
          node --check assets/js/main.js
          node scripts/validate-site.mjs
          grep -Fq 'https://darendetarim.com/' sitemap.xml
          grep -Fq 'Sitemap: https://darendetarim.com/sitemap.xml' robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
